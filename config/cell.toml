# Beam Cell configuration - edit this file, then restart the app (./start.sh).
# Anything you leave out uses the default shown in beamcell/config.py.
# Check it with:  python3 -m beamcell.doctor

[safety]
# What the software does when something is unsafe. These mirror the hard-wired safety
# circuit a real machine must have (see docs/SAFETY.md) - they are not a substitute for it.
estop_category = 0              # BS EN 60204-1 stop category for the E-stop: 0 = cut power now, 1 = controlled stop then cut power
protective_stop_category = 1    # gate / light curtain / person in danger zone
require_extraction = true       # no plasma cutting unless fume extraction is running (COSHH, LEV)
require_camera = false          # true: the machine won't run unless the camera is working
camera_object_stop = false      # true: an object YOLO sees lying on the bed (camera bed zone) stops the machine.
                                # Leave false until you've watched it on the Camera tab - a shadow must not stop a job
camera_stale_s = 1.5            # camera counts as failed if no picture for this long
heartbeat_timeout_s = 2.0       # the operator screen must check in this often, or the machine stops
warning_speed = 0.25            # speed when someone is in the camera's warning zone
manual_speed_mm_s = 250         # Manual mode speed limit (BS EN ISO 10218-1 reduced speed)
log_file = "logs/safety_log.jsonl"
checklist = [
  "Outfeed table and scrap tray cleared from the last job",
  "Fence panels and gate closed, light curtain clear",
  "Walked round the cell - nobody inside",
  "Fume extraction running (LEV examined in the last 14 months)",
  "E-stops tested this shift (press, check stop, release, reset)",
  "Arc screens in place, PPE on (eye protection shade, gloves, hearing protection)",
  "Fire extinguisher at the cell, sparks area clear of combustibles",
  "Magnet lifter inspected (LOLER thorough examination in date)",
]

[safety.light_curtain]          # used for the BS EN ISO 13855 minimum safety distance
resolution_mm = 30              # detection capability d of the curtain
response_ms = 20                # curtain response time
machine_stop_ms = 600           # measured stopping time of the machine (measure it on the real thing!)

[camera]
source = "auto"                 # "auto" finds one; "0"/"1" a USB camera; "csi" the Jetson ribbon camera; or a video file
autostart = false
model = ""                      # a YOLO .onnx file in models/ (empty = first one found, else HOG)
warning_zone = [0.05, 0.15, 0.95, 1.0]   # left, top, right, bottom as fractions of the picture
danger_zone  = [0.25, 0.35, 0.75, 1.0]
bed_zone     = [0.15, 0.45, 0.85, 0.85] # the roller bed in the picture: objects lying here are reported

[gpio]
# Optional wiring of real buttons/switches to the Orin's 40-pin header (BOARD pin numbers).
# Each input must be a normally-closed contact to GND with a 10k pull-up to 3.3 V, so a
# broken wire reads as "unsafe" (fail-safe). 0 = not wired. See docs/SAFETY.md, "Wiring".
enabled = false
estop_pin = 0                   # auxiliary NC contact of the E-stop button
gate_pin = 0                    # gate interlock switch (closed = gate shut)
curtain_pin = 0                 # light curtain OSSD status (via a relay contact)
reset_pin = 0                   # blue reset push-button (normally open, to GND)
poll_hz = 50

[assistant]
# Optional AI advisor: explains what the cell is doing and answers questions.
# Advisory only - it can never move or start the machine. Needs internet,
# `pip install anthropic` and an ANTHROPIC_API_KEY (see docs/ASSISTANT.md).
enabled = false
model = "claude-opus-5-5"
effort = "low"                  # low = quick answers; medium/high = more careful
send_camera = true              # include the latest camera picture with a question

[plasma]
# Which cut chart the planner uses (beamcell/plasma.py): "o2" = O2 plasma production machine,
# "air" = air plasma, "pen" = the 1:10 prototype's pen. Replace the numbers in plasma.py with the
# cut chart of YOUR plasma system before cutting real steel.
process = "o2"

[sensors]
# Sensors that are not fitted yet are simulated (see the Sensors tab and docs/SENSORS.md).
simulate = true
torch_camera = ""               # the second camera, close up on the torch: "0"/"1" USB, "csi", or "" = not fitted

[server]
port = 8080
