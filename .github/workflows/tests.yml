# Runs the headless tests on GitHub every time code is pushed.
# No Arduino and no screen here - hardware tests still happen on the Jetson.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" on the Actions tab

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # same library versions as the Jetson (JetPack 6 / Ubuntu 22.04 packages)
          - name: jetson-like
            python: "3.10"
            libs: numpy==1.21.5 matplotlib==3.5.1 pyserial
          - name: latest
            python: "3.12"
            libs: numpy matplotlib pyserial
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install libraries
        run: pip install ${{ matrix.libs }}

      - name: Check every file has valid Python
        run: python -m py_compile *.py gantry/*.py

      - name: Window scripts load
        run: python test_scripts_load.py

      - name: Exercises (must be 8/8)
        run: |
          python exercises.py all --quick --solution | tee exercises.out
          grep -q "Score: 8/8" exercises.out

      - name: Inverse kinematics (300 random jumps)
        run: python test_ik_target.py

      - name: Gantry cell (planner, collisions, app)
        run: python test_gantry.py

  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile the Arduino sketches for the UNO
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
          for sketch in arduino/*/; do
            arduino-cli compile --fqbn arduino:avr:uno "$sketch"
          done
