# Runs the tests on GitHub on every push.
#   orin-like : the same versions as the Jetson Orin (Python 3.12, numpy 1.26.4, OpenCV 4.6)
#   latest    : the newest Python libraries
#   browser   : the real web app in headless Chromium (no JavaScript errors, plan, import, STL)
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button on the Actions tab

jobs:
  python:
    name: python (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orin-like
            python: "3.12"
            libs: numpy==1.26.4 opencv-python-headless==4.6.0.66
          - name: latest
            python: "3.13"
            libs: numpy opencv-python-headless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install libraries
        run: pip install ${{ matrix.libs }}
      - name: Every file is valid Python
        run: python -m compileall -q beamcell tests
      - name: Unit tests (sections, UK rules, NC1, planner, server, camera)
        run: python -m unittest discover -s tests -t . -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install numpy==1.26.4
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          python -m beamcell.server --port 8099 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8099/api/info > /dev/null && break; sleep 1; done
      - name: Browser test
        run: |
          mkdir -p shots
          node tests/ui_smoke.mjs http://localhost:8099 shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

  every-section:
    # slow (~4 min): every cuttable UK section; runs when started by hand from the Actions tab
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==1.26.4
      - run: python tests/sweep_sections.py
