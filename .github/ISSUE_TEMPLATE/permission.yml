name: Permission to use or collaborate
description: Ask to use, build on or collaborate on BEAM CELL (code, CAD, design).
title: "Permission / collaboration: "
labels: ["permission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in BEAM CELL. You can read everything here; using, building on or
        selling it needs written permission (see LICENSE). I read every request.
        **This request is public** - please don't add a phone number, address or other private details.
  - type: input
    id: name
    attributes:
      label: Your name
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: How can I contact you? (LinkedIn profile, company website...)
    validations:
      required: true
  - type: input
    id: organisation
    attributes:
      label: Company, university or organisation (if any)
  - type: dropdown
    id: who
    attributes:
      label: Which best describes you?
      options:
        - Steel fabricator
        - Engineer / designer
        - Student or researcher
        - Possible sponsor or investor
        - Other
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you like to use it for?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I will not share, publish or sell the code or the design without written permission from Ravi Mahadeva.
          required: true
